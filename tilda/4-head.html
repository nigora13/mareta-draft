<script>
(function () {
  var q = location.search;
  if (q.indexOf("utm_") === -1) return;
  document.addEventListener("click", function (e) {
    var a = e.target.closest('a[href*="getcourse.ru"]');
    if (!a) return;
    var u = new URL(a.href);
    new URLSearchParams(q).forEach(function (v, k) {
      if (k.indexOf("utm_") === 0 && !u.searchParams.has(k)) u.searchParams.set(k, v);
    });
    a.href = u.toString();
  }, true);
})();
</script>
